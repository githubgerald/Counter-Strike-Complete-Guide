
name: CS2 Movement Guide CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server JavaScript
        run: node --check server.js

      - name: Check validation script
        run: node --check scripts/validate-content.js

      - name: Validate website content
        run: npm run validate
