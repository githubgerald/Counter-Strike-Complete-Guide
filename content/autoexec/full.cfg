// ============================================================
// PLAYER
// ============================================================
name ""                                         // Player name (add yours)
cl_prefer_lefthanded 0                          // Left-handed viewmodel preference (0-1)
player_nevershow_communityservermessage 1       // Hide community server messages (0-1)

// ============================================================
// CROSSHAIR
// ============================================================
// Main crosshair
cl_crosshairstyle 4                             
// Style numbers:
// 0 = Dynamic Cross, 1 = Dynamic Circle, 2 = Dynamic Cross (Classic), 3 = Static Circle,
// 4 = Static Cross, 5 = Dynamic Cross (Legacy), 6 = Dot Only, 7 = Dynamic Quad (new default),
// 8 = Static Square, 9 = Static Quadrant
cl_crosshair_length 10                          // Arm length (0-255)
cl_crosshair_thickness 1                        // Arm thickness (1-31)
cl_crosshair_gap 6                              // Centre gap (0-128)
cl_crosshairdot 0                               // Centre dot (0-1)
cl_crosshair_t 0                                // T-shaped crosshair (0-1)
cl_crosshaircolor_r 0                           // Crosshair red component (0-255)
cl_crosshaircolor_g 255                         // Crosshair green component (0-255)
cl_crosshaircolor_b 65                          // Crosshair blue component (0-255)
cl_crosshaircolor_a 255                         // Crosshair opacity (0-255; 255 = opaque)
cl_crosshair_drawoutline 1                      // Outline: 0 = off, 1 = full, 2 = half
cl_crosshairoutline_r 0                         // Outline red component (0-255)
cl_crosshairoutline_g 0                         // Outline green component (0-255)
cl_crosshairoutline_b 0                         // Outline blue component (0-255)
cl_crosshairoutline_a 128                       // Outline opacity (0-255)
cl_crosshair_recoil 0                           // Follow recoil (0-1)
cl_crosshair_sniper_width 2                     // Sniper scope line width
cl_crosshair_friendly_warning 1                 // Teammate warning: 0 = off, 1 = flash, 2 = icon
crosshair 1                                     // Draw crosshair (0-1)

// Dynamic crosshair settings
// The spread limit affects dynamic crosshair behaviour. Split settings are for legacy style 2.
cl_crosshair_dynamic_spread_limit 0             // Dynamic spread limit (0-255)
cl_crosshair_dynamic_maxdist_splitratio 1       // Inner/outer length ratio (0-1; style 2 only)
cl_crosshair_dynamic_splitalpha_innermod 0      // Inner split opacity modifier (0-1; style 2 only)
cl_crosshair_dynamic_splitalpha_outermod 1      // Outer split opacity modifier (0.3-1; style 2 only)
cl_crosshair_dynamic_splitdist 4                // Split distance (style 2 only)

// Grenade crosshair
cl_grenadecrosshair_keepusercrosshair 1         // Keep normal crosshair visible with grenade crosshair (0-1)
cl_grenadecrosshair_decoy 1                     // Decoy grenade crosshair (0-1)
cl_grenadecrosshair_explosive 1                 // HE grenade crosshair (0-1)
cl_grenadecrosshair_fire 1                      // Molotov/incendiary crosshair (0-1)
cl_grenadecrosshair_flash 1                     // Flashbang crosshair (0-1)
cl_grenadecrosshair_smoke 1                     // Smoke grenade crosshair (0-1)
cl_grenadecrosshairdelay_decoy 2                // Delay before decoy grenade crosshair appears (seconds)
cl_grenadecrosshairdelay_explosive 2            // Delay before HE grenade crosshair appears (seconds)
cl_grenadecrosshairdelay_fire 2                 // Delay before fire grenade crosshair appears (seconds)
cl_grenadecrosshairdelay_flash 2                // Delay before flashbang crosshair appears (seconds)
cl_grenadecrosshairdelay_smoke 2                // Delay before smoke grenade crosshair appears (seconds)

// ============================================================
// SCOPE
// ============================================================
cl_ironsight_dot_scale 0.8                      // Dot size in AUG/SG 553 sights (0.1–2)
cl_ironsight_usecrosshaircolor 1                // Match ironsight dot to crosshair colour (0-1)
cl_sniper_auto_rezoom 1                         // Re-zoom after each sniper shot (0-1)
cl_debounce_zoom 0                              // Ignore a second zoom press that happens too quickly (0-1)

// ============================================================
// VIEWMODEL
// ============================================================
viewmodel_fov 68                                // Viewmodel FOV (54-68)
viewmodel_offset_x 2.5                          // Horizontal offset (-2.5 to 2.5)
viewmodel_offset_y 2                            // Depth offset (-2 to 2)
viewmodel_offset_z -2                           // Vertical offset (-2 to 2)
viewmodel_presetpos 0                           // Position preset: 0 = custom, 1 = desktop, 2 = couch, 3 = classic
cl_silencer_mode 0                              // Silencer preference: 0 = attached, 1 = detached

// ============================================================
// MOVEMENT
// ============================================================
bind w +forward                                // Forward
bind a +left                                   // Strafe left
bind s +back                                   // Backward
bind d +right                                  // Strafe right
bind space +jump                               // Jump
bind mwheeldown +jump                          // Jump on mouse wheel down
bind mwheelup +jump                            // Jump on mouse wheel up
bind ctrl +duck                                // Crouch
bind shift +sprint                             // Walk
bind e +use                                    // Use, defuse, interact
input_button_code_is_scan_code_scd 1           // Bind by physical keyboard position (0 = key name, 1 = physical position)

// ============================================================
// WEAPONS
// ============================================================
bind mouse1 +attack                            // Fire
bind mouse2 +attack2                           // Secondary fire
bind r +reload                                 // Reload
bind g drop                                    // Drop weapon
bind q lastinv                                 // Last weapon
bind f +lookatweapon                           // Inspect weapon
bind 1 slot1                                   // Primary weapon
bind 2 slot2                                   // Pistol
bind 3 slot3                                   // Knife
bind 5 slot5                                   // Bomb
bind k slot12                                  // Slot 12

// ============================================================
// GRENADE BINDS
// ============================================================
bind c slot7                                   // Flashbang
bind x slot8                                   // Smoke grenade
bind z slot10                                  // Molotov/incendiary
unbind 7                                       // Unbind number 7
unbind 8                                       // Unbind number 8
unbind 9                                       // Unbind number 9

// ============================================================
// BUY
// ============================================================
bind b buymenu                                 // Buy menu
bind f3 autobuy                                // Autobuy
bind f4 rebuy                                  // Rebuy
cl_use_opens_buy_menu 0                        // Use key does not open buy menu (0-1)
cl_buywheel_donate_key 0                       // Buy-wheel donation modifier key
cl_buywheel_nonumberpurchasing 1               // Allow number-key purchasing in buy wheel (0-1)
cl_buymenu_ct_nextround_high 5000              // CT next-round high-money threshold
cl_buymenu_ct_nextround_low 1400               // CT next-round low-money threshold
cl_buymenu_t_nextround_high 5000               // T next-round high-money threshold
cl_buymenu_t_nextround_low 1400                // T next-round low-money threshold

// ============================================================
// COMMUNICATION
// ============================================================
bind y messagemode                             // All chat
bind u messagemode2                            // Team chat
bind v +voicerecord                            // Push to talk
bind 0 +radialradio                            // Radio wheel
bind mouse3 player_ping                        // Ping
unbind t                             	       // Spray menu
sv_voiceenable 1                               // Enable/disable incoming voice chat (0-1)
voice_vox 0                                    // Open microphone (0-1; 0 = push-to-talk)
closecaption 0                                 // Closed captions (0-1)

// ============================================================
// MOUSE
// ============================================================
bind mouse4 noclip                             // Noclip in practice servers with cheats enabled
sensitivity 0.7                                // Mouse sensitivity
sensitivity_y_scale 1                          // Vertical sensitivity multiplier
zoom_sensitivity_ratio 1.0                     // Scoped sensitivity multiplier
m_yaw 0.022                                    // Default horizontal mouse angle multiplier
m_pitch 0.022                                  // Default vertical mouse angle multiplier

// ============================================================
// CONTROLLER
// ============================================================
joystick 0                                     // Disable joystick/controller input (0-1)
panorama_joystick_enabled 0                    // Disable controller input in menus (0-1)

// ============================================================
// NETWORK
// ============================================================
rate 1000000                                   // Maximum supported rate: 1000000 bytes/second
cl_net_buffer_ticks 0                          // Packet buffering: 0 = none, 1 = one tick, 2 = two ticks
mm_dedicated_search_maxping 150                // Maximum matchmaking server ping (milliseconds)
engine_low_latency_sleep_after_client_tick 1   // Low-latency sleep timing option (0-1)

// ============================================================
// HUD
// ============================================================
// Basic HUD and position information
cl_showfps 0                                   // FPS display mode: (0-1)
cl_showpos 0                                   // Show position and movement speed: (0-1)
cl_hud_color 0                                 // HUD colour: 0-12; 0 = team colour
hud_scaling 1                                  // HUD scale (0.9-1.1)
cl_showloadout 1                               // Keep loadout visible (0-1)
cl_draw_only_deathnotices 0                    // Show only death notices (0-1)
hud_showtargetid 1                             // Show player name when aiming at them (0-1)

// Telemetry defaults
cl_hud_telemetry_ping_show 0                   // Ping: 0 = off, 1 = only if poor, 2 = always
cl_hud_telemetry_frametime_show 0              // Frame time: 0 = off, 1 = only if poor, 2 = always
cl_hud_telemetry_net_misdelivery_show 0        // Network misdelivery: 0 = off, 1 = only if poor, 2 = always
cl_hud_telemetry_net_detailed 0                // Detailed loss/late delivery/jitter: 0 = off, 1 = poor, 2 = always
cl_hud_telemetry_net_quality_graph_show 0      // Network quality graph: 0 = off, 1 = poor, 2 = always
cl_hud_telemetry_serverrecvmargin_graph_show 0 // Server receive-margin graph: 0 = off, 1 = queue issues, 2 = always

// ============================================================
// RADAR
// ============================================================
cl_hud_radar_scale 1.1                         // Radar panel size (0.8-1.3)
cl_radar_scale 0.35                            // Radar zoom (0.25-1; lower shows more of the map)
cl_radar_always_centered 0                     // Keep player centred (0-1)
cl_radar_rotate 1                              // Rotate radar with player (0-1)
cl_radar_icon_scale_min 0.4                    // Minimum radar icon size (0.4-1)
cl_radar_square_with_scoreboard 1              // Square radar when scoreboard is open (0-1)

// ============================================================
// AUDIO
// ============================================================
volume 0.25                                    // Master volume (0-1)
snd_voipvolume 2                               // Incoming teammate voice volume (0-2; 141% on the game's slider scale)
snd_mvp_volume 0.36                            // MVP music volume (0-1)
snd_roundaction_volume 0.25                    // Round action music volume (0-1)
snd_roundend_volume 0.25                       // Round end music volume (0-1)
snd_roundstart_volume 0.25                     // Round start music volume (0-1)
snd_deathcamera_volume 0.16                    // Death camera music volume (0-1)
snd_tensecondwarning_volume 0.04               // Ten-second warning music volume (0-1)
snd_mapobjective_volume 0.04                   // Bomb/hostage objective volume (0-1)
snd_menumusic_volume 0.16                      // Menu music volume (0-1)
snd_musicvolume 1                              // Overall music volume multiplier (0-1)
snd_mute_losefocus 1                           // Mute game while alt-tabbed (0-1)

// ============================================================
// VIDEO AND PERFORMANCE
// ============================================================
fps_max 999                                    // FPS cap; 0 = unlimited
fps_max_ui 120                                 // Menu FPS cap
engine_no_focus_sleep 0                        // Sleep delay while unfocused, in milliseconds
r_drawtracers_firstperson 1                    // Draw first-person bullet tracers (0-1)
r_fullscreen_gamma 1.7                         // Fullscreen gamma/brightness (1-4)
mat_disable_bloom 1			       // Disable bloom/glow effects (0-1)

// ============================================================
// PRACTICE
// ============================================================
alias "prac" "exec practice"
alias "pracknife" "mp_drop_knife_enable 1; mp_items_prohibited 0; slot3; drop; subclass_create 508"

// ============================================================
// MISC
// ============================================================
con_enable 1                                   // Enable developer console (0-1)
bind "`" toggleconsole                         // Toggle console
cl_autohelp 0                                  // Disable beginner help popups (0-1)
cl_hide_avatar_images 0			       // Used to hide avatar images (0-2) 0: off, 1: All, 2: All but friends
gameinstructor_enable 0                        // Disable instructor hints (0-1)
cl_scoreboard_mouse_enable_binding +attack2    // Right-click unlocks mouse on scoreboard
bind tab +showscores                           // Scoreboard

// Simple aliases
alias dc "disconnect"
alias q "quit"

// Network telemetry toggle
alias "network" "toggle cl_hud_telemetry_ping_show 0 2; toggle cl_hud_telemetry_frametime_show 0 2; toggle cl_hud_telemetry_net_misdelivery_show 0 2; toggle cl_hud_telemetry_net_detailed 0 2; toggle cl_hud_telemetry_net_quality_graph_show 0 2; toggle cl_hud_telemetry_serverrecvmargin_graph_show 0 2"
bind ";" "network"

// FPS toggle
alias "fpss" "toggle cl_showfps 0 1"

echo "autoexec.cfg loaded successfully"
host_writeconfig
